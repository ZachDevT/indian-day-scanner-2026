name: india_day_scanner
description: India Day 2026 - ETMS Gate Scanning App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5

  # Networking
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1

  # Local Storage
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # QR Scanning
  mobile_scanner: ^7.2.0

  # Connectivity
  connectivity_plus: ^6.0.3

  # Dependency Injection
  get_it: ^7.6.7

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0
  rxdart: ^0.27.7

  # UI
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  hugeicons: ^1.2.0
  permission_handler: ^11.3.1

dependency_overrides: {}

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/

  fonts:
    - family: Enzyme
      fonts:
        - asset: assets/fonts/Enzyme_trial.otf
          weight: 400

    - family: Gilroy
      fonts:
        - asset: assets/fonts/Gilroy-Light.otf
          weight: 300
        - asset: assets/fonts/Gilroy-ExtraBold.otf
          weight: 800

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/new-logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#080808"
  image: "assets/images/new-logo.png"
  android_12:
    color: "#080808"
    image: "assets/images/new-logo.png"
